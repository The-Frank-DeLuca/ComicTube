<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Comedy Rooms — ComicTube</title>
<style>
  :root{ --bg:#0C0C0D; --surface:#1A1A1A; --surface-2:#242426; --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.16); --text:#F5F5F7; --text-muted:#9A9AA2; --text-faint:#68686F; --red:#CC0000; --green:#34C759; --amber:#FF9F0A; --danger:#FF453A; --blue:#0A84FF; --radius:14px; --shadow:0 12px 28px rgba(0,0,0,.45); --z-nav:10; --z-sticky:20; --safe-bottom:env(safe-area-inset-bottom,0px); }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;} html,body{margin:0;padding:0;}
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--text); min-height:100dvh; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 20% 15%, rgba(204,0,0,.16), transparent 45%), radial-gradient(circle at 80% 85%, rgba(204,0,0,.10), transparent 40%), #050505; }
  a{color:inherit; text-decoration:none;} button{font-family:inherit;}
  .device{ position:relative; width:100%; height:100dvh; max-width:100%; background:var(--bg); overflow:hidden; display:flex; flex-direction:column; }
  @media (min-width:760px){ .device{ width:390px; height:844px; max-height:92vh; border-radius:46px; border:10px solid #111214; box-shadow:var(--shadow), 0 0 0 1px rgba(255,255,255,.04);} }
  .statusbar{ display:none; position:absolute; top:0; left:0; right:0; height:44px; align-items:flex-end; justify-content:space-between; padding:0 22px 6px; font-size:14px; font-weight:600; z-index:5; pointer-events:none;}
  @media (min-width:760px){ .statusbar{ display:flex; } .screen{ padding-top:44px; } }
  .statusbar .dot{display:flex; gap:4px; align-items:flex-end;} .statusbar .sig{width:3px; background:#fff; border-radius:1px;}
  .statusbar .sig:nth-child(1){height:5px;} .statusbar .sig:nth-child(2){height:7px;} .statusbar .sig:nth-child(3){height:9px;} .statusbar .sig:nth-child(4){height:11px;}
  .screen{ position:relative; flex:1; overflow-y:auto; scrollbar-width:none; display:flex; flex-direction:column; min-height:0; }
  .screen::-webkit-scrollbar{ display:none; }
  .topbar{ position:sticky; top:0; z-index:var(--z-sticky); display:flex; align-items:center; height:56px; padding:0 16px; background:rgba(12,12,13,.86); backdrop-filter:blur(14px); border-bottom:1px solid var(--border); }
  .topbar h1{ font-size:19px; font-weight:800; margin:0; }
  p{ margin:0; line-height:1.5; color:var(--text-muted); font-size:13px; }
  .content-scroll{ flex:1; overflow-y:auto; padding:14px 16px; }
  .sec-label{ font-size:11.5px; font-weight:800; color:var(--text-faint); text-transform:uppercase; letter-spacing:.5px; margin:12px 0 8px; }
  .room-card{ display:flex; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:12px; margin-bottom:10px; cursor:pointer; align-items:center; }
  .room-thumb{ width:56px; height:56px; border-radius:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative; color:#fff; font-weight:800; overflow:hidden; }
  .avatar-photo{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:inherit; z-index:1; }
  .live-dot{ position:absolute; top:-3px; right:-3px; width:14px; height:14px; border-radius:50%; background:var(--danger); border:2px solid var(--surface); animation:pulse 1.4s infinite; z-index:2; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(255,69,58,.5);} 70%{box-shadow:0 0 0 8px rgba(255,69,58,0);} 100%{box-shadow:0 0 0 0 rgba(255,69,58,0);} }
  .room-body{ flex:1; min-width:0; } .room-name{ font-weight:700; font-size:14px; }
  .room-meta{ font-size:12px; color:var(--text-faint); margin-top:2px; }
  .badge-live{ display:inline-flex; align-items:center; gap:5px; background:rgba(255,69,58,.15); color:var(--danger); font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:20px; text-transform:uppercase; margin-top:4px; }
  .tabbar{ position:sticky; bottom:0; z-index:var(--z-nav); display:flex; background:rgba(20,20,21,.92); backdrop-filter:blur(16px); border-top:1px solid var(--border); padding:6px 4px calc(6px + var(--safe-bottom)); }
  .tabbar a{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; color:var(--text-faint); font-size:10px; font-weight:600; border-radius:12px; cursor:pointer; }
  .tabbar a.active{ color:var(--red); }
  .tabbar svg{ width:22px; height:22px; }
</style>
</head>
<body>
<div class="device">
  <div class="statusbar"><span id="clock">9:41</span><div class="dot"><div class="sig"></div><div class="sig"></div><div class="sig"></div><div class="sig"></div></div></div>
  <div class="screen">
    <div class="topbar"><h1>Comedy Rooms</h1></div>
    <div class="content-scroll">
      <div class="sec-label">Live Now</div>
      <div id="live-list"></div>
      <div class="sec-label">Upcoming</div>
      <div id="upcoming-list"></div>
    </div>
    <div class="tabbar" id="tabbar"></div>
  </div>
</div>
<script>
const CT_KEY = 'ct_state_v1';
function ctGetState(){ try{ return JSON.parse(localStorage.getItem(CT_KEY)) || {role:null}; }catch(e){ return {role:null}; } }
function ctClock(){ const el = document.getElementById('clock'); if(!el) return; const d = new Date(); let h = d.getHours(); const m = d.getMinutes().toString().padStart(2,'0'); h = h%12; if(h===0) h=12; el.textContent = h+':'+m; }
ctClock(); setInterval(ctClock, 15000);

function renderTabbar(){
  const role = ctGetState().role;
  const tabbar = document.getElementById('tabbar');
  if(role === 'comedian'){
    tabbar.innerHTML = `
      <a onclick="location.href='https://comictube.app/comedian-dashboard'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg><span>Dashboard</span></a>
      <a onclick="location.href='https://comictube.app/analytics'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="12" width="3.5" height="8"/><rect x="10.25" y="6" width="3.5" height="14"/><rect x="16.5" y="9" width="3.5" height="11"/></svg><span>Analytics</span></a>
      <a onclick="location.href='https://comictube.app/community'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/></svg><span>Community</span></a>
      <a onclick="location.href='https://comictube.app/events'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span>Events</span></a>
      <a onclick="location.href='https://comictube.app/comedian-account'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg><span>Account</span></a>
    `;
  } else {
    tabbar.innerHTML = `
      <a onclick="location.href='https://comictube.app/discover'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13 13l-4.5 2.5L11 11z"/></svg><span>Discover</span></a>
      <a onclick="location.href='https://comictube.app/events'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span>Events</span></a>
      <a class="active" onclick="location.href='https://comictube.app/rooms'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3"/></svg><span>Rooms</span></a>
      <a onclick="location.href='https://comictube.app/saved'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>Saved</span></a>
      <a onclick="location.href='https://comictube.app/account'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg><span>Account</span></a>
    `;
  }
}
renderTabbar();

const COMEDIANS = { c1:{name:'Nina Volkov', color:'#CC0000', img:47}, c2:{name:'Marcus Boone', color:'#0A84FF', img:13}, c4:{name:'Deshawn Ruiz', color:'#34C759', img:14} };
const ROOMS = [
  {id:'r1', title:'Friday Night Freestyle', comedianId:'c2', format:'Open Mic', live:true, viewers:184},
  {id:'r2', title:'Nina Unfiltered', comedianId:'c1', format:'Solo Set', live:false, start:'Today, 9:00 PM'},
  {id:'r3', title:'Roast Prep Live', comedianId:'c4', format:'Solo Set', live:false, start:'Tomorrow, 8:30 PM'}
];
function initials(name){ return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

const live = ROOMS.filter(r=>r.live);
const upcoming = ROOMS.filter(r=>!r.live);

document.getElementById('live-list').innerHTML = live.length ? live.map(r=>{
  const c = COMEDIANS[r.comedianId];
  return `<div class="room-card" onclick="location.href='https://comictube.app/live-room-fan?id=${r.id}'">
    <div class="room-thumb" style="background:${c.color}"><span class="live-dot"></span>${initials(c.name)}<img class="avatar-photo" src="https://i.pravatar.cc/150?img=${c.img}" alt="" onerror="this.remove()"></div>
    <div class="room-body"><div class="room-name">${r.title}</div><div class="room-meta">${c.name} · ${r.format}</div><span class="badge-live">● Live · ${r.viewers} watching</span></div>
  </div>`;
}).join('') : '<p style="padding:8px 0 4px;">No rooms are live right now.</p>';

document.getElementById('upcoming-list').innerHTML = upcoming.map(r=>{
  const c = COMEDIANS[r.comedianId];
  return `<div class="room-card">
    <div class="room-thumb" style="background:${c.color}">${initials(c.name)}<img class="avatar-photo" src="https://i.pravatar.cc/150?img=${c.img}" alt="" onerror="this.remove()"></div>
    <div class="room-body"><div class="room-name">${r.title}</div><div class="room-meta">${c.name} · ${r.format}</div><div class="room-meta" style="color:var(--amber); font-weight:700;">${r.start}</div></div>
  </div>`;
}).join('');
</script>
</body>
</html>
