<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Live — ComicTube</title>
<style>
  :root{ --bg:#0C0C0D; --surface:#1A1A1A; --surface-2:#242426; --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.16); --text:#F5F5F7; --text-muted:#9A9AA2; --text-faint:#68686F; --red:#CC0000; --green:#34C759; --amber:#FF9F0A; --danger:#FF453A; --blue:#0A84FF; --radius:14px; --shadow:0 12px 28px rgba(0,0,0,.45); --z-overlay:40; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;} html,body{margin:0;padding:0;}
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--text); min-height:100dvh; display:flex; align-items:center; justify-content:center; background:#000; }
  a{color:inherit; text-decoration:none;} button{font-family:inherit;}
  .device{ position:relative; width:100%; height:100dvh; max-width:100%; background:#000; overflow:hidden; }
  @media (min-width:760px){ .device{ width:390px; height:844px; max-height:92vh; border-radius:46px; border:10px solid #111214; box-shadow:var(--shadow), 0 0 0 1px rgba(255,255,255,.04);} }
  .stage{ position:absolute; inset:0; background:radial-gradient(circle at 50% 30%, #2a0505, #000 70%); display:flex; align-items:center; justify-content:center; }
  .stage-avatar{ width:120px; height:120px; border-radius:50%; background:var(--red); display:flex; align-items:center; justify-content:center; font-size:40px; font-weight:800; color:#fff; box-shadow:0 0 0 6px rgba(255,255,255,.06); position:relative; overflow:hidden; }
  .avatar-photo{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:inherit; z-index:1; }
  .topbar{ position:absolute; top:0; left:0; right:0; z-index:20; display:flex; align-items:center; gap:10px; padding:14px; }
  @media (min-width:760px){ .topbar{ padding-top:52px; } }
  .live-pill{ display:flex; align-items:center; gap:6px; background:var(--danger); padding:6px 10px; border-radius:20px; font-size:11px; font-weight:800; text-transform:uppercase; }
  .dot{ width:7px; height:7px; border-radius:50%; background:#fff; animation:blink 1s infinite; }
  @keyframes blink{ 50%{opacity:.3;} }
  .viewer-pill{ margin-left:auto; display:flex; align-items:center; gap:6px; background:rgba(0,0,0,.45); padding:6px 12px; border-radius:20px; font-size:12px; font-weight:700; }
  .viewer-pill svg{ width:14px; height:14px; }
  .bottom-panel{ position:absolute; left:0; right:0; bottom:0; z-index:20; padding:16px; background:linear-gradient(to top, rgba(0,0,0,.85), transparent); }
  .reaction-tally{ display:flex; gap:14px; margin-bottom:14px; }
  .reaction-tally div{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:#fff; }
  .reaction-tally svg{ width:18px; height:18px; }
  .btn{ height:50px; border-radius:14px; border:none; font-size:15px; font-weight:800; cursor:pointer; width:100%; }
  .btn-end{ background:var(--danger); color:#fff; }
  .btn:active{ transform:scale(.97); }
  .floaters{ position:absolute; inset:0; z-index:15; pointer-events:none; overflow:hidden; }
  .floater{ position:absolute; bottom:150px; font-size:22px; animation:float-up 2.2s ease-out forwards; }
  @keyframes float-up{ from{ transform:translateY(0) scale(1); opacity:1;} to{ transform:translateY(-260px) scale(1.3); opacity:0;} }
  .overlay{ position:absolute; inset:0; background:rgba(0,0,0,.65); z-index:var(--z-overlay); display:none; align-items:center; justify-content:center; padding:24px; }
  .overlay.show{ display:flex; }
  .dialog{ width:100%; max-width:300px; background:var(--surface); border-radius:20px; padding:22px 20px; text-align:center; box-shadow:var(--shadow); }
  .dialog h3{ font-size:16px; margin:0 0 8px; } .dialog p{ font-size:13px; color:var(--text-muted); margin:0 0 16px; line-height:1.5; }
  .btn-row{ display:flex; gap:10px; }
  .btn-secondary{ background:var(--surface-2); color:var(--text); border:1px solid var(--border-strong); height:46px; border-radius:12px; font-weight:700; flex:1; cursor:pointer; }
  .btn-danger{ background:var(--danger); color:#fff; height:46px; border-radius:12px; font-weight:700; flex:1; border:none; cursor:pointer; }
</style>
</head>
<body>
<div class="device">
  <div class="stage"><div class="stage-avatar">NV<img class="avatar-photo" src="https://i.pravatar.cc/200?img=47" alt="" onerror="this.remove()"></div></div>
  <div class="floaters" id="floaters"></div>
  <div class="topbar">
    <div class="live-pill"><span class="dot"></span>You're Live</div>
    <div class="viewer-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3 3-5 6-5s6 2 6 5"/></svg><span id="viewer-count">96</span></div>
  </div>
  <div class="bottom-panel">
    <div class="reaction-tally">
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M8.5 10.5h.01M15.5 10.5h.01M7.5 14a5 5 0 0 0 9 0"/></svg><span id="count-laugh">412</span></div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3s5 4 5 9a5 5 0 0 1-10 0c0-1.5.8-2.5 1.5-3.3.2 1 .9 1.8 1.8 1.8-.3-2 .3-4 2.7-5.5-.3 1.2 0 2 1 2z"/></svg><span id="count-fire">298</span></div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l1.2 4.6L18 8l-4.8 1.4L12 14l-1.2-4.6L6 8l4.8-1.4z"/></svg><span id="count-clap">176</span></div>
    </div>
    <button class="btn btn-end" onclick="confirmEnd()">End Room</button>
  </div>

  <div class="overlay" id="end-overlay">
    <div class="dialog">
      <h3>End this room?</h3>
      <p>Your recording will be automatically saved and posted to your profile within 15 minutes.</p>
      <div class="btn-row">
        <button class="btn-secondary" onclick="document.getElementById('end-overlay').classList.remove('show')">Keep Going</button>
        <button class="btn-danger" onclick="endRoom()">End Room</button>
      </div>
    </div>
  </div>
</div>
<script>
let viewers = 96;
setInterval(()=>{ viewers += Math.round((Math.random()-.35)*4); if(viewers<10) viewers=10; document.getElementById('viewer-count').textContent = viewers; }, 2500);

const counts = { laugh:412, fire:298, clap:176 };
const emoji = { laugh:'😂', fire:'🔥', clap:'👏' };
function spawnFloater(type){
  const wrap = document.getElementById('floaters');
  const el = document.createElement('div');
  el.className = 'floater'; el.style.left = (20 + Math.random()*60) + '%'; el.textContent = emoji[type];
  wrap.appendChild(el); setTimeout(()=>el.remove(), 2300);
}
setInterval(()=>{
  const types = ['laugh','fire','clap'];
  const t = types[Math.floor(Math.random()*types.length)];
  counts[t]++; document.getElementById('count-'+t).textContent = counts[t];
  if(Math.random() > .35) spawnFloater(t);
}, 1100);

function confirmEnd(){ document.getElementById('end-overlay').classList.add('show'); }
function endRoom(){
  document.getElementById('end-overlay').classList.remove('show');
  document.body.innerHTML += '';
  setTimeout(()=>{ location.href = 'comedian-dashboard.html?ended=1'; }, 300);
}
</script>
</body>
</html>
