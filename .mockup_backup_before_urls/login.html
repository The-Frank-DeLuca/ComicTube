<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Log In — ComicTube</title>
<style>
  :root{
    --bg:#0C0C0D; --surface:#1A1A1A; --surface-2:#242426; --surface-3:#2E2E31;
    --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.16);
    --text:#F5F5F7; --text-muted:#9A9AA2; --text-faint:#68686F;
    --red:#CC0000; --red-dark:#A30000; --red-glow:rgba(204,0,0,.35);
    --green:#34C759; --amber:#FF9F0A; --danger:#FF453A; --blue:#0A84FF;
    --radius-sm:8px; --radius:14px; --radius-lg:22px;
    --shadow:0 12px 28px rgba(0,0,0,.45);
    --z-nav:10; --z-sticky:20; --z-dropdown:30; --z-overlay:40; --z-modal:45; --z-toast:60;
    --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#000; color:var(--text); min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 20% 15%, rgba(204,0,0,.16), transparent 45%), radial-gradient(circle at 80% 85%, rgba(204,0,0,.10), transparent 40%), #050505;
  }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit;}
  .device{ position:relative; width:100%; height:100dvh; max-width:100%; background:var(--bg); overflow:hidden; }
  @media (min-width:760px){ .device{ width:390px; height:844px; max-height:92vh; border-radius:46px; border:10px solid #111214; box-shadow:var(--shadow), 0 0 0 1px rgba(255,255,255,.04);} }
  .statusbar{ display:none; position:absolute; top:0; left:0; right:0; height:44px; align-items:flex-end; justify-content:space-between; padding:0 22px 6px; font-size:14px; font-weight:600; z-index:var(--z-nav); pointer-events:none; }
  @media (min-width:760px){ .statusbar{ display:flex; } .screen{ padding-top:44px; } }
  .statusbar .dot{display:flex; gap:4px; align-items:flex-end;}
  .statusbar .sig{width:3px; background:#fff; border-radius:1px;}
  .statusbar .sig:nth-child(1){height:5px;} .statusbar .sig:nth-child(2){height:7px;} .statusbar .sig:nth-child(3){height:9px;} .statusbar .sig:nth-child(4){height:11px;}
  .screen{ position:relative; height:100%; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .screen::-webkit-scrollbar{ display:none; }
  .topbar{ position:sticky; top:0; z-index:var(--z-sticky); display:flex; align-items:center; gap:10px; height:56px; padding:0 8px; background:rgba(12,12,13,.86); backdrop-filter:blur(14px); border-bottom:1px solid var(--border); }
  .topbar h1{ font-size:17px; font-weight:700; margin:0; flex:1; text-align:center; padding-right:40px; }
  .iconbtn{ width:40px; height:40px; min-width:40px; border-radius:50%; border:none; background:transparent; color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background .15s ease; }
  .iconbtn:hover{ background:var(--surface-2); }
  .iconbtn:active{ transform:scale(.92); }
  h1,h2,h3{ margin:0 0 4px; }
  h2{ font-size:22px; font-weight:800; letter-spacing:-.3px; }
  h3{ font-size:15px; font-weight:700; }
  p{ margin:0 0 8px; line-height:1.55; color:var(--text-muted); font-size:14px; }
  .muted{ color:var(--text-muted); }
  .faint{ color:var(--text-faint); }
  .pad{ padding:16px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:48px; padding:0 20px; border-radius:var(--radius); border:none; font-size:15px; font-weight:700; cursor:pointer; width:100%; transition:transform .12s ease, background .15s ease, opacity .15s ease; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--red); color:#fff; }
  .btn-primary:hover{ background:#e00000; }
  .btn-secondary{ background:var(--surface-2); color:var(--text); border:1px solid var(--border-strong); }
  .btn-ghost{ background:transparent; color:var(--red); }
  .btn[disabled]{ opacity:.6; pointer-events:none; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--text-muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.4px; }
  .field input{ width:100%; height:48px; border-radius:12px; border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text); padding:0 14px; font-size:16px; font-family:inherit; transition:border-color .15s ease, box-shadow .15s ease; }
  .field input:focus{ outline:none; border-color:var(--red); box-shadow:0 0 0 3px var(--red-glow); }
  .field .err-msg{ font-size:12px; color:var(--danger); margin-top:5px; display:none; font-weight:600; }
  .field.error input{ border-color:var(--danger); }
  .field.error .err-msg{ display:block; }
  #toast-wrap{ position:absolute; left:0; right:0; bottom:0; z-index:var(--z-toast); display:flex; flex-direction:column; align-items:center; gap:8px; padding:0 16px 16px; pointer-events:none; }
  .toast{ pointer-events:auto; max-width:340px; width:100%; display:flex; gap:10px; align-items:flex-start; background:#1E1E20; border:1px solid var(--border-strong); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow); animation:toast-in .25s ease; border-left:4px solid var(--blue); }
  .toast.success{ border-left-color:var(--green); } .toast.error{ border-left-color:var(--danger); } .toast.warn{ border-left-color:var(--amber); }
  .toast svg{ width:20px; height:20px; flex-shrink:0; margin-top:1px; }
  .toast.success svg{ color:var(--green); } .toast.error svg{ color:var(--danger); } .toast.warn svg{ color:var(--amber); }
  .toast .msg{ font-size:13.5px; line-height:1.4; color:var(--text); font-weight:600; }
  @keyframes toast-in{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }

  /* page-specific */
  .lg-wrap{ padding:26px 20px 40px; }
  .lg-logo{ width:56px; height:56px; border-radius:16px; background:var(--red); display:flex; align-items:center; justify-content:center; margin-bottom:18px; }
  .lg-logo svg{ width:30px; height:30px; color:#fff; }
  .tabs{ display:flex; background:var(--surface-2); border-radius:12px; padding:4px; margin-bottom:22px; }
  .tabs button{ flex:1; border:none; background:transparent; color:var(--text-muted); font-weight:700; font-size:13.5px; padding:10px 0; border-radius:9px; cursor:pointer; transition:all .15s ease; }
  .tabs button.active{ background:var(--red); color:#fff; }
  .link-row{ text-align:right; margin:-8px 0 20px; }
  .link-row a{ font-size:12.5px; color:var(--red); font-weight:700; cursor:pointer; }
  .demo-note{ margin-top:24px; padding:12px 14px; background:var(--surface); border:1px dashed var(--border-strong); border-radius:12px; font-size:12px; color:var(--text-faint); line-height:1.6; }
  .divider-or{ display:flex; align-items:center; gap:10px; margin:18px 0; color:var(--text-faint); font-size:12px; font-weight:700; }
  .divider-or::before, .divider-or::after{ content:''; flex:1; height:1px; background:var(--border); }
  .signup-row{ text-align:center; margin-top:6px; font-size:13px; color:var(--text-muted); }
  .signup-row a{ color:var(--red); font-weight:700; }
</style>
</head>
<body>
<div class="device">
  <div class="statusbar"><span id="clock">9:41</span><div class="dot"><div class="sig"></div><div class="sig"></div><div class="sig"></div><div class="sig"></div></div></div>
  <div class="screen">
    <div class="topbar">
      <button class="iconbtn" onclick="location.href='index.html'" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1>Log In</h1>
    </div>

    <div class="lg-wrap">
      <div class="lg-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h13v11H10l-3 3z"/><path d="M4 8v11l3-3h2"/></svg>
      </div>
      <h2>Welcome back</h2>
      <p>Log in to continue to ComicTube.</p>

      <div class="tabs">
        <button id="tab-fan" class="active" onclick="setRole('fan')">Fan</button>
        <button id="tab-comedian" onclick="setRole('comedian')">Comedian</button>
      </div>

      <form id="login-form" onsubmit="return doLogin(event)">
        <div class="field" id="f-email">
          <label for="email">Email address</label>
          <input id="email" type="email" placeholder="you@example.com" required value="jordan.ellis@example.com">
          <div class="err-msg">Enter a valid email address.</div>
        </div>
        <div class="field" id="f-pass">
          <label for="pass">Password</label>
          <input id="pass" type="password" placeholder="••••••••" required value="demopass1">
          <div class="err-msg">Incorrect email or password. Try again.</div>
        </div>
        <div class="link-row"><a onclick="ctToast('Password reset link sent to your email (demo).','success')">Forgot password?</a></div>
        <button class="btn btn-primary" type="submit" id="login-btn">Log In</button>
      </form>

      <div class="signup-row">
        No account? <a onclick="goRegister()">Sign up as <span id="signup-role">a Fan</span></a>
      </div>

      <div class="demo-note">
        <strong>Demo tip:</strong> any email/password logs in successfully. Type <code>fail</code> as the password to preview the error state.
      </div>
    </div>
  </div>
  <div id="toast-wrap"></div>
</div>

<script>
const CT_KEY = 'ct_state_v1';
function ctDefaultState(){ return { role:null, fan:{name:'Jordan Ellis',email:'jordan.ellis@example.com',membershipTier:'Free',contentMode:'Adult',dob:'1998-04-12',followed:['c1','c3'],saved:['c2'],lastViewedComedian:'c1',billingDate:null,attending:[]}, comedian:{id:'c1',stageName:'Nina Volkov',email:'nina@example.com',genre:'Stand-Up',city:'Los Angeles, CA',dob:'1994-02-20',earningsActive:false,stripeConnected:false,monetizationUnlocked:false} }; }
function ctGetState(){ try{ const raw = localStorage.getItem(CT_KEY); if(!raw) throw 0; return Object.assign(ctDefaultState(), JSON.parse(raw)); }catch(e){ const d = ctDefaultState(); localStorage.setItem(CT_KEY, JSON.stringify(d)); return d; } }
function ctSetState(patch){ const cur = ctGetState(); const next = Object.assign({}, cur, patch); localStorage.setItem(CT_KEY, JSON.stringify(next)); return next; }
function ctToast(message, type){ type = type || 'success'; const wrap = document.getElementById('toast-wrap'); if(!wrap) return; const icons = { success:'<path d="M8 12.5l2.5 2.5L16 9"/><circle cx="12" cy="12" r="9"/>', error:'<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>', warn:'<path d="M12 3 2 20h20z"/><path d="M12 9v5M12 17h.01"/>' }; const el = document.createElement('div'); el.className = 'toast ' + type; el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+icons[type]+'</svg><div class="msg">'+message+'</div>'; wrap.appendChild(el); setTimeout(()=>{ el.style.transition='opacity .25s ease, transform .25s ease'; el.style.opacity='0'; el.style.transform='translateY(8px)'; setTimeout(()=>el.remove(),260); }, 3000); }
function ctClock(){ const el = document.getElementById('clock'); if(!el) return; const d = new Date(); let h = d.getHours(); const m = d.getMinutes().toString().padStart(2,'0'); h = h%12; if(h===0) h=12; el.textContent = h+':'+m; }
ctClock(); setInterval(ctClock, 15000);

let selectedRole = 'fan';
function setRole(role){
  selectedRole = role;
  document.getElementById('tab-fan').classList.toggle('active', role==='fan');
  document.getElementById('tab-comedian').classList.toggle('active', role==='comedian');
  document.getElementById('signup-role').textContent = role==='fan' ? 'a Fan' : 'a Comedian';
}
function goRegister(){ window.location.href = selectedRole === 'fan' ? 'fan-register.html' : 'comedian-register.html'; }

function doLogin(e){
  e.preventDefault();
  const emailField = document.getElementById('f-email');
  const passField = document.getElementById('f-pass');
  emailField.classList.remove('error'); passField.classList.remove('error');
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;

  if(!email || !email.includes('@')){
    emailField.classList.add('error');
    ctToast('Please fix the highlighted field.','error');
    return false;
  }
  if(pass.toLowerCase() === 'fail'){
    passField.classList.add('error');
    ctToast('Login failed — incorrect email or password.','error');
    return false;
  }

  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Logging in…';

  setTimeout(()=>{
    ctSetState({ role: selectedRole });
    if(selectedRole === 'fan'){ ctToast('Welcome back, Jordan!','success'); }
    else { ctToast('Welcome back, Nina!','success'); }
    setTimeout(()=>{
      window.location.href = selectedRole === 'fan' ? 'discover.html' : 'comedian-dashboard.html';
    }, 650);
  }, 500);
  return false;
}
</script>
</body>
</html>
