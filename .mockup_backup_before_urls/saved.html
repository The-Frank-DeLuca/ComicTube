<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Saved — ComicTube</title>
<style>
  :root{ --bg:#0C0C0D; --surface:#1A1A1A; --surface-2:#242426; --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.16); --text:#F5F5F7; --text-muted:#9A9AA2; --text-faint:#68686F; --red:#CC0000; --green:#34C759; --amber:#FF9F0A; --danger:#FF453A; --blue:#0A84FF; --radius:14px; --shadow:0 12px 28px rgba(0,0,0,.45); --z-nav:10; --z-sticky:20; --z-toast:60; --safe-bottom:env(safe-area-inset-bottom,0px); }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;} html,body{margin:0;padding:0;}
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--text); min-height:100dvh; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 20% 15%, rgba(204,0,0,.16), transparent 45%), radial-gradient(circle at 80% 85%, rgba(204,0,0,.10), transparent 40%), #050505; }
  a{color:inherit; text-decoration:none;} button{font-family:inherit;}
  .device{ position:relative; width:100%; height:100dvh; max-width:100%; background:var(--bg); overflow:hidden; display:flex; flex-direction:column; }
  @media (min-width:760px){ .device{ width:390px; height:844px; max-height:92vh; border-radius:46px; border:10px solid #111214; box-shadow:var(--shadow), 0 0 0 1px rgba(255,255,255,.04);} }
  .statusbar{ display:none; position:absolute; top:0; left:0; right:0; height:44px; align-items:flex-end; justify-content:space-between; padding:0 22px 6px; font-size:14px; font-weight:600; z-index:5; pointer-events:none;}
  @media (min-width:760px){ .statusbar{ display:flex; } .screen{ padding-top:44px; } }
  .statusbar .dot{display:flex; gap:4px; align-items:flex-end;} .statusbar .sig{width:3px; background:#fff; border-radius:1px;}
  .statusbar .sig:nth-child(1){height:5px;} .statusbar .sig:nth-child(2){height:7px;} .statusbar .sig:nth-child(3){height:9px;} .statusbar .sig:nth-child(4){height:11px;}
  .screen{ position:relative; flex:1; overflow-y:auto; scrollbar-width:none; display:flex; flex-direction:column; min-height:0; }
  .screen::-webkit-scrollbar{ display:none; }
  .topbar{ position:sticky; top:0; z-index:var(--z-sticky); display:flex; align-items:center; height:56px; padding:0 16px; background:rgba(12,12,13,.86); backdrop-filter:blur(14px); border-bottom:1px solid var(--border); }
  .topbar h1{ font-size:19px; font-weight:800; margin:0; }
  p{ margin:0; line-height:1.5; color:var(--text-muted); font-size:13px; }
  .content-scroll{ flex:1; overflow-y:auto; padding:16px; }
  .list-card{ display:flex; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:12px; margin-bottom:10px; align-items:center; cursor:pointer; }
  .list-avatar{ width:50px; height:50px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; flex-shrink:0; position:relative; overflow:hidden; }
  .avatar-photo{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:inherit; z-index:1; }
  .list-body{ flex:1; min-width:0; }
  .list-name{ font-weight:700; font-size:14px; }
  .list-meta{ font-size:12px; color:var(--text-faint); margin-top:2px; }
  .remove-btn{ width:34px; height:34px; border-radius:10px; border:1px solid var(--border-strong); background:var(--surface-2); color:var(--danger); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .empty{ text-align:center; padding:60px 20px; }
  .empty svg{ width:44px; height:44px; color:var(--text-faint); margin-bottom:12px; }
  .tabbar{ position:sticky; bottom:0; z-index:var(--z-nav); display:flex; background:rgba(20,20,21,.92); backdrop-filter:blur(16px); border-top:1px solid var(--border); padding:6px 4px calc(6px + var(--safe-bottom)); }
  .tabbar a{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; color:var(--text-faint); font-size:10px; font-weight:600; border-radius:12px; cursor:pointer; }
  .tabbar a.active{ color:var(--red); }
  .tabbar svg{ width:22px; height:22px; }
  #toast-wrap{ position:absolute; left:0; right:0; bottom:70px; z-index:var(--z-toast); display:flex; flex-direction:column; align-items:center; gap:8px; padding:0 16px; pointer-events:none; }
  .toast{ pointer-events:auto; max-width:340px; width:100%; display:flex; gap:10px; align-items:flex-start; background:#1E1E20; border:1px solid var(--border-strong); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow); animation:toast-in .25s ease; border-left:4px solid var(--blue); }
  .toast.success{ border-left-color:var(--green); }
  .toast svg{ width:20px; height:20px; flex-shrink:0; margin-top:1px; } .toast.success svg{ color:var(--green); }
  .toast .msg{ font-size:13px; line-height:1.4; color:var(--text); font-weight:600; }
  @keyframes toast-in{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
</style>
</head>
<body>
<div class="device">
  <div class="statusbar"><span id="clock">9:41</span><div class="dot"><div class="sig"></div><div class="sig"></div><div class="sig"></div><div class="sig"></div></div></div>
  <div class="screen">
    <div class="topbar"><h1>Saved Comedians</h1></div>
    <div class="content-scroll" id="list"></div>
    <div class="tabbar">
      <a onclick="location.href='discover.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13 13l-4.5 2.5L11 11z"/></svg><span>Discover</span></a>
      <a onclick="location.href='events.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span>Events</span></a>
      <a onclick="location.href='rooms.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3"/></svg><span>Rooms</span></a>
      <a class="active" onclick="location.href='saved.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>Saved</span></a>
      <a onclick="location.href='account.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg><span>Account</span></a>
    </div>
  </div>
  <div id="toast-wrap"></div>
</div>
<script>
const CT_KEY = 'ct_state_v1';
function ctDefaultState(){ return { role:null, fan:{name:'Jordan Ellis',email:'jordan.ellis@example.com',membershipTier:'Free',contentMode:'Adult',dob:'1998-04-12',followed:['c1','c3'],saved:['c2'],lastViewedComedian:'c1',billingDate:null,attending:[]}, comedian:{id:'c1',stageName:'Nina Volkov',email:'nina@example.com',genre:'Stand-Up',city:'Los Angeles, CA',dob:'1994-02-20',earningsActive:false,stripeConnected:false,monetizationUnlocked:false} }; }
function ctGetState(){ try{ const raw = localStorage.getItem(CT_KEY); if(!raw) throw 0; return Object.assign(ctDefaultState(), JSON.parse(raw)); }catch(e){ const d = ctDefaultState(); localStorage.setItem(CT_KEY, JSON.stringify(d)); return d; } }
function ctSetFan(patch){ const s = ctGetState(); s.fan = Object.assign({}, s.fan, patch); localStorage.setItem(CT_KEY, JSON.stringify(s)); }
function ctToast(message, type){ type = type || 'success'; const wrap = document.getElementById('toast-wrap'); if(!wrap) return; const icons = { success:'<path d="M8 12.5l2.5 2.5L16 9"/><circle cx="12" cy="12" r="9"/>' }; const el = document.createElement('div'); el.className = 'toast ' + type; el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+icons[type]+'</svg><div class="msg">'+message+'</div>'; wrap.appendChild(el); setTimeout(()=>{ el.style.transition='opacity .25s ease, transform .25s ease'; el.style.opacity='0'; el.style.transform='translateY(8px)'; setTimeout(()=>el.remove(),260); }, 2400); }
function ctClock(){ const el = document.getElementById('clock'); if(!el) return; const d = new Date(); let h = d.getHours(); const m = d.getMinutes().toString().padStart(2,'0'); h = h%12; if(h===0) h=12; el.textContent = h+':'+m; }
ctClock(); setInterval(ctClock, 15000);

const COMEDIANS = [
  {id:'c1', name:'Nina Volkov', genre:'Stand-Up', city:'Los Angeles, CA', color:'#CC0000', img:47},
  {id:'c2', name:'Marcus Boone', genre:'Improv', city:'Chicago, IL', color:'#0A84FF', img:13},
  {id:'c3', name:'Priya Shah', genre:'Storytelling', city:'Austin, TX', color:'#FF9F0A', img:44},
  {id:'c4', name:'Deshawn Ruiz', genre:'Roast', city:'Atlanta, GA', color:'#34C759', img:14},
  {id:'c5', name:'Ollie Chen', genre:'Sketch', city:'Seattle, WA', color:'#AF52DE', img:15},
  {id:'c6', name:'Fatima Idris', genre:'Stand-Up', city:'Brooklyn, NY', color:'#FF453A', img:48}
];
function initials(name){ return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

function render(){
  const s = ctGetState();
  const list = document.getElementById('list');
  const items = COMEDIANS.filter(c => s.fan.saved.includes(c.id));
  if(!items.length){
    list.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
      <h3 style="margin:0 0 6px;">Nothing saved yet</h3>
      <p>Tap the bookmark icon on any comedian to save them here.</p>
    </div>`;
    return;
  }
  list.innerHTML = items.map(c => `
    <div class="list-card" onclick="location.href='comedian-profile.html?id=${c.id}'">
      <div class="list-avatar" style="background:${c.color}">${initials(c.name)}<img class="avatar-photo" src="https://i.pravatar.cc/150?img=${c.img}" alt="" onerror="this.remove()"></div>
      <div class="list-body"><div class="list-name">${c.name}</div><div class="list-meta">${c.genre} · ${c.city}</div></div>
      <button class="remove-btn" onclick="event.stopPropagation(); remove('${c.id}')" aria-label="Remove">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/></svg>
      </button>
    </div>
  `).join('');
}
function remove(id){
  const s = ctGetState();
  ctSetFan({ saved: s.fan.saved.filter(x=>x!==id) });
  ctToast('Removed from Saved.', 'success');
  render();
}
render();
</script>
</body>
</html>
